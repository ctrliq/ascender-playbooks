---
- name: Patch Enterprise Linux Hosts
  hosts: all
  become: true
  vars:
    security_updates: false
    update_kernel: true
    reboot_kernel: true
  tasks:

    # Installing the latest available package is the whole point of a
    # patching run, so the idempotency rule is skipped for these two tasks
    # rather than pinning them to `state: present`.
    - name: Install Updates (exclude Kernel)  # noqa: package-latest
      ansible.builtin.dnf:
        name: '*'
        state: latest
        security: "{{ security_updates }}"
        skip_broken: true
        exclude: kernel*
      register: updates

    - name: Install Kernel Updates  # noqa: package-latest
      ansible.builtin.dnf:
        name: 'kernel'
        state: latest
      when: update_kernel | bool
      register: updated_kernel

    - name: Gather Package Facts
      ansible.builtin.package_facts:
        manager: auto
      when: ansible_os_family != 'Windows'

    - name: Reboot Server if Kernel Updates were done
      ansible.builtin.reboot:
      when:
        - update_kernel | bool
        - reboot_kernel | bool
        - updated_kernel.changed
